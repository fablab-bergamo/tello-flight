name: Checks and portable builds
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m mkdocs build --strict
      - run: python -m tello_flight --diagnose --seconds 2 --bundle artifacts/simulator-debug.zip
      - run: python -m tello_flight --screenshot artifacts/console.png
      - run: python -m tello_flight --program --screenshot artifacts/program.png
      - run: python scripts/build.py
      - name: Smoke test bundled runtime (Windows)
        if: runner.os == 'Windows'
        run: ./dist/TelloFlight/TelloFlight.exe --diagnose --seconds 2
      - name: Smoke test bundled runtime (Linux)
        if: runner.os == 'Linux'
        run: ./dist/TelloFlight/TelloFlight --diagnose --seconds 2
      - uses: actions/upload-artifact@v4
        with:
          name: TelloFlight-${{ runner.os }}
          path: |
            dist/TelloFlight/
            artifacts/
