name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: ubuntu-24.04
            asset: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/build.py
      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        run: |
          ./dist/TelloFlight/TelloFlight.exe --diagnose --seconds 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/TelloFlight/TelloFlight.exe --program --screenshot artifacts/program.png
      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: |
          ./dist/TelloFlight/TelloFlight --diagnose --seconds 2
          ./dist/TelloFlight/TelloFlight --program --screenshot artifacts/program.png
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TelloFlight -DestinationPath TelloFlight-windows-x64.zip
      - name: Archive Linux
        if: runner.os == 'Linux'
        run: tar -czf TelloFlight-linux-x64.tar.gz -C dist TelloFlight
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            TelloFlight-*.zip
            TelloFlight-*.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: packages
      - run: sha256sum TelloFlight-* > SHA256SUMS.txt
        working-directory: packages
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" packages/* --verify-tag \
            --notes-file "release-notes/$GITHUB_REF_NAME.md" \
            --title "Tello Flight $GITHUB_REF_NAME" "${release_flags[@]}"
